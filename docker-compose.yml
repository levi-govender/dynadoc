services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dynadoc
      POSTGRES_PASSWORD: dynadoc
      POSTGRES_DB: dynadoc
    ports:
      - "5432:5432"
    volumes:
      - dynadoc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynadoc -d dynadoc"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  dynadoc_pg:
