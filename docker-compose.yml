services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dynadoc
      POSTGRES_PASSWORD: dynadoc
      POSTGRES_DB: dynadoc
    ports:
      - "5432:5432"
    volumes:
      - dynadoc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynadoc -d dynadoc"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dynadoc
      MINIO_ROOT_PASSWORD: dynadocsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dynadoc_minio:/data

volumes:
  dynadoc_pg:
  dynadoc_minio:
